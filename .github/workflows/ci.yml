name: ci

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref (push + PR triggers otherwise
# duplicate work on PR branches).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Cargo.lock is intentionally gitignored, so cargo invocations here run
# without `--locked` and resolve fresh dependency versions per run.
jobs:
  rust:
    runs-on: ubuntu-latest
    # playwright-rs 0.12.x fails to emit its required compile-time version
    # when its build-time driver download is unavailable. Keep compilation
    # deterministic; browser installation remains a runtime concern.
    env:
      PLAYWRIGHT_DRIVER_VERSION: 1.59.1
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      - run: cargo nextest run --workspace --all-features
        timeout-minutes: 20
      - run: cargo test --workspace --all-features --doc
        timeout-minutes: 10

  # The no-sqlite default build is what most library consumers get; compile
  # and test it explicitly.
  default-features:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_DRIVER_VERSION: 1.59.1
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --workspace
        timeout-minutes: 20
      - run: cargo test --workspace --doc
        timeout-minutes: 10

  # Keep the toolchain version in sync with `rust-version` in Cargo.toml.
  msrv:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_DRIVER_VERSION: 1.59.1
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo check --workspace --all-features --all-targets
      - run: cargo nextest run --workspace --all-features
        timeout-minutes: 20
      - run: cargo test --workspace --all-features --doc
        timeout-minutes: 10

  # Compiles the `#[cfg(windows)]` branches natively (check only, no tests).
  windows:
    runs-on: windows-latest
    env:
      PLAYWRIGHT_DRIVER_VERSION: 1.59.1
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features --all-targets

  # Kani proofs for small pure cores (token ledger arithmetic, UTF-8
  # truncation). CBMC has no memory limit of its own, so proofs run under
  # scripts/kani-guarded.sh: one that strays into heap-heavy code is killed
  # at the ceiling instead of exhausting the runner.
  kani:
    runs-on: ubuntu-latest
    env:
      KANI_VERSION: 0.68.0
      KANI_MAX_RSS_MB: 8192
      KANI_TIMEOUT_S: 900
      PLAYWRIGHT_DRIVER_VERSION: 1.59.1
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - id: kani-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-kani
            ~/.cargo/bin/kani
            ~/.kani
          key: kani-${{ runner.os }}-${{ env.KANI_VERSION }}
      - if: steps.kani-cache.outputs.cache-hit != 'true'
        run: |
          cargo install --locked kani-verifier --version "$KANI_VERSION"
          cargo kani setup
      - run: ../../scripts/kani-guarded.sh --lib
        working-directory: crates/halter-protocol
      - run: ../../scripts/kani-guarded.sh --lib
        working-directory: crates/halter-tools

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo generate-lockfile
      - run: cargo audit
