name: soak

# Long runs of the randomized session-driver tests, against both the in-memory
# and SQLite stores. Every PR already runs 128 and 32 cases respectively
# through the normal suite; this samples far more interleavings. A failure
# prints the shrunk operation sequence in the log.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      cases:
        description: Generated cases to run
        default: "5000"

jobs:
  session-driver-model:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PLAYWRIGHT_DRIVER_VERSION: 1.59.1
      PROPTEST_CASES: ${{ inputs.cases || '5000' }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Matches both the in-memory and SQLite model tests.
      - run: >-
          cargo test -p halter-runtime --lib
          session_driver_model_tests::session_driver_model
